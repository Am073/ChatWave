[project]
name = "chatwave-backend"
version = "2.0.0"
description = "ChatWave v2 - FastAPI-based multi-tenant agentic AI platform"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # API / server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    # Config / validation
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "motor>=3.5.0",
    "beanie>=1.27.0",
    "qdrant-client>=1.12.0",
    # Cache / queue
    "redis>=5.1.0",
    "celery>=5.4.0",
    # Security / auth
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    # AI stack
    "litellm>=1.50.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "langfuse>=2.53.0",
    # Document parsing
    "docling>=2.5.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pytesseract>=0.3.10",
    # Evals
    "ragas>=0.2.0",
    "deepeval>=2.1.0",
    # Observability / utils
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
    "cryptography>=42.0.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
