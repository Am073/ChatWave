services:
  mongo:
    image: mongo:7
    container_name: chatwave-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: chatwave-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # FIX[1]: Redis service for Celery broker, backend cache, and health endpoint
  redis:
    image: redis:7-alpine
    container_name: chatwave-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  qdrant-data:
  redis-data:
